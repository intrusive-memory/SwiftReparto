name: Lint

# `swift format`, invoked directly, is the lint tool here — not a `make` target.
# `make format` is `swift format -i -r .`: it rewrites the checkout in place and
# would therefore "pass" by linting whatever it had just written. A lint gate
# must be read-only, and the last step in this job is the standing assertion
# that it stayed that way.
#
# (The project-wide prohibition on SwiftPM drivers covers `swift build` and
# `swift test`. `swift format` is not a build driver and is not covered.)

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26

    # Every gating job in this repo declares a deadline; see tests.yml. Linting
    # a handful of files finishes in seconds, so 15 minutes is many times the
    # worst realistic run and exists only to catch a wedge.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show swift-format version
        run: swift format --version

      # HARD GATE, and it now covers both trees.
      #
      # `Tests/` was advisory until Sortie 8 because a single Sortie 1 file,
      # `Tests/SwiftRepartoTests/PackageSmokeTests.swift`, grouped its imports in
      # a way `OrderedImports` rejects. That file has been deleted — its Yams
      # round-trip is subsumed by `YAMLCodingTests.swift` — so the exception it
      # existed for is gone and the advisory step with it.
      #
      # `--strict` promotes every finding to an error, so any unformatted code
      # in either tree fails the PR. No `continue-on-error`, no `|| true`, no
      # `if: always()`. This step's exit status is the job's.
      #
      # Do not re-demote either tree to advisory. If a rule is genuinely wrong
      # for this repo, disable that rule in a `.swift-format` file where the
      # decision is visible — do not stop gating a whole directory.
      - name: Lint Sources and Tests (strict)
        run: swift format lint --strict --recursive Sources Tests

      # Nothing above is supposed to write to the checkout. If anyone ever points
      # this job at `make format`, or at any other in-place tool, this fails and
      # says why.
      - name: Fail if linting modified the checkout
        run: |
          if ! git diff --exit-code; then
            echo "::error::The lint step modified tracked files. A lint gate must be read-only — see the Makefile's format target."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The lint step left untracked files in the checkout."
            exit 1
          fi
